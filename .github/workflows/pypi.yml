name: Python Wheel
on: 
  push:
    branches:
      - v6
    tags:
      - v[0-9]+.*
      - test-release.*
  workflow_dispatch:
  pull_request:
  merge_group:

jobs:
  windows-build:
    strategy:
      matrix:
        pyversion: ["3.11"]
    runs-on: "windows-latest"
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyversion }}
          architecture: x64
      - name: Build Wheel (PyO3 Binding)
        uses: messense/maturin-action@v1
        with:
          target: x86_64
          command: build
          args: --release --strip -F python --bindings pyo3 --interpreter python --manifest-path Cargo.toml --out dist-pyo3
      - name: Build Wheel (Bin Binding)
        uses: messense/maturin-action@v1
        with:
          target: x86_64
          command: build
          args: --release --strip -F binary --bindings bin --interpreter python --manifest-path Cargo.toml --out dist-bin
      - name: Merge Wheels
        shell: bash
        run: bash merge-wheel.bash
      - name: Install wheel
        run: pip install aspeak --no-index --find-links dist --no-deps --force-reinstall
      - name: Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: dist

  macos-build:
    strategy:
      matrix:
        include:
          - pyversion: "3.11"
            runner: macos-13
            arch: "x86_64"
            abbr-arch: x64
          - pyversion: "3.11"
            runner: macos-14
            arch: "aarch64"
            abbr-arch: arm64  
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyversion }}
          architecture: ${{ matrix.abbr-arch }}
      - name: Build Wheel (PyO3 Binding)
        uses: messense/maturin-action@v1
        with:
          target: ${{ matrix.arch }}
          command: build
          args: --release --strip -F python --bindings pyo3 --interpreter python --manifest-path Cargo.toml --out dist-pyo3
      - name: Build Wheel (Bin Binding)
        uses: messense/maturin-action@v1
        with:
          target: ${{ matrix.arch }}
          command: build
          args: --release --strip -F binary --bindings bin --interpreter python --manifest-path Cargo.toml --out dist-bin
      - name: Merge Wheels
        run: bash merge-wheel.bash
      - name: Install wheel
        run: pip install --no-index ./dist/aspeak-*.whl --no-deps --force-reinstall
      - name: Save Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.arch }}
          path: dist

